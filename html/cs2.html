<!DOCTYPE html>
<html lang="en">
<head>
  <script src="auth.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Case Opener</title>
</head>
<body>

<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100vh;background:#080a0e;display:flex;align-items:center;justify-content:center;padding:20px;}
.wrap{background:#080a0e;border-radius:0;overflow:hidden;font-family:'Exo 2',sans-serif;color:#c8cdd8;width:100%;position:relative;}
.header{background:#0e1118;border-bottom:1px solid #1c2130;padding:14px 18px;display:flex;align-items:center;gap:12px}
.header-icon{width:40px;height:40px;background:#ffd700;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-text h2{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:#ffd700;letter-spacing:2px;line-height:1}
.header-text p{font-size:10px;color:#4a5568;margin-top:2px;letter-spacing:0.5px}
.inv-btn{margin-left:auto;background:#12161e;border:1px solid #1c2130;border-radius:7px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#c8cdd8;font-family:'Exo 2',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.5px;transition:background 0.15s}
.inv-btn:hover{background:#1a2030}
.inv-badge{background:#ffd700;color:#0a0c10;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.body{padding:16px 0 0 0}
.legend{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;padding:0 18px}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:0.8px;text-transform:uppercase}
.reel-wrap{position:relative;overflow:hidden;border-radius:0;border-top:1px solid #1c2130;border-bottom:1px solid #1c2130;background:#0b0d12;height:136px;margin-bottom:10px}
.reel-track{display:flex;position:absolute;top:0;left:0;height:100%;will-change:transform;transition:none}
.reel-item{width:116px;flex-shrink:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-right:1px solid #161a24;padding:8px}
.reel-item canvas{display:block}
.reel-name{font-size:9.5px;text-align:center;color:#4a5568;font-weight:600;letter-spacing:0.3px;line-height:1.3}
.rarity-pip{width:5px;height:5px;border-radius:50%}
.needle{position:absolute;left:50%;top:0;transform:translateX(-50%);width:2px;height:100%;background:#ffd700;z-index:10;pointer-events:none}
.needle::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #ffd700}
.needle::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:9px solid #ffd700}
.fade-l{position:absolute;top:0;left:0;width:18%;height:100%;background:linear-gradient(90deg,#0b0d12,transparent);pointer-events:none;z-index:5}
.fade-r{position:absolute;top:0;right:0;width:18%;height:100%;background:linear-gradient(270deg,#0b0d12,transparent);pointer-events:none;z-index:5}
.open-btn{display:block;width:calc(100% - 36px);margin-left:18px;padding:13px;background:#ffd700;color:#0a0c10;border:none;border-radius:7px;font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:background 0.12s,transform 0.1s;margin-top:2px}
.open-btn:hover{background:#ffe840}

.result-box{display:none;margin-top:12px;margin-left:18px;margin-right:18px;border-radius:9px;padding:14px;text-align:center;border:1px solid transparent;animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
.result-rarity-label{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:4px}
.result-gun-wrap{display:flex;justify-content:center;margin:4px 0 6px}
.result-item-name{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;line-height:1.15;margin-bottom:2px}
.result-skin{font-size:11px;color:#4a5568;letter-spacing:0.5px}
.stats{display:flex;gap:8px;margin-top:12px;padding:0 18px}
.stat{flex:1;background:#0e1118;border:1px solid #1c2130;border-radius:7px;padding:9px;text-align:center}
.stat-val{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:#ffd700;line-height:1}
.stat-lbl{font-size:9px;color:#4a5568;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.history{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;padding:0 18px 16px}
.h-pill{font-size:9.5px;padding:3px 8px;border-radius:3px;font-weight:700;letter-spacing:0.3px}
.knife-reveal{display:none;position:absolute;inset:0;z-index:200;background:#05060a;border-radius:0;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.knife-reveal.on{display:flex}
.reveal-eyebrow{font-size:11px;font-weight:700;color:#ffd700;letter-spacing:4px;text-transform:uppercase;margin-bottom:3px;opacity:0.7}
.reveal-stars{font-family:'Rajdhani',sans-serif;font-size:26px;color:#ffd700;letter-spacing:6px;margin-bottom:8px;animation:starPulse 0.8s ease-in-out infinite alternate}
@keyframes starPulse{from{opacity:0.5;letter-spacing:5px}to{opacity:1;letter-spacing:11px}}
.reveal-name{font-family:'Rajdhani',sans-serif;font-size:34px;font-weight:700;color:#ffd700;line-height:1.1;animation:namePop 1.5s ease-in-out infinite alternate}
@keyframes namePop{from{opacity:0.85;transform:scale(0.98)}to{opacity:1;transform:scale(1.03)}}
.reveal-skin-lbl{font-size:13px;color:#b8960a;letter-spacing:1px;margin-top:4px;margin-bottom:3px}
.reveal-stattrak{font-size:11px;color:#cf6a32;letter-spacing:1px;font-weight:700;margin-bottom:18px}
.reveal-bar-track{width:200px;height:3px;background:#1c2130;border-radius:2px;overflow:hidden}
.reveal-bar-fill{height:100%;background:#ffd700;border-radius:2px;transition:width linear}
.reveal-timer{font-size:11px;color:#4a5568;letter-spacing:0.5px;margin-top:7px}
.inv-overlay{display:none;position:absolute;inset:0;z-index:300;background:#080a0e;border-radius:0;flex-direction:column}
.inv-overlay.on{display:flex}
.inv-header{background:#0e1118;border-bottom:1px solid #1c2130;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.inv-header h3{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;color:#ffd700;letter-spacing:2px}
.inv-close{background:#12161e;border:1px solid #1c2130;border-radius:6px;padding:6px 12px;cursor:pointer;color:#c8cdd8;font-family:'Exo 2',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.5px;transition:background 0.12s}
.inv-close:hover{background:#1a2030}
.inv-body{padding:14px 18px;overflow-y:auto;flex:1}
.inv-empty{text-align:center;color:#4a5568;font-size:13px;margin-top:40px;line-height:1.8}
.inv-empty span{font-size:32px;display:block;margin-bottom:10px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.inv-card{border-radius:8px;padding:10px;text-align:center;border:1px solid transparent;cursor:default}
.inv-card canvas{display:block;margin:0 auto 6px}
.inv-card-name{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;line-height:1.2}
.inv-card-skin{font-size:10px;color:#4a5568;margin-top:2px}
.inv-card-rarity{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
.inv-filters{padding:10px 18px;border-bottom:1px solid #1c2130;background:#0b0d12;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inv-filters label{font-size:10px;color:#4a5568;letter-spacing:1px;text-transform:uppercase;font-family:'Exo 2',sans-serif;margin-right:2px}
.inv-select{background:#12161e;border:1px solid #1c2130;border-radius:6px;padding:5px 8px;color:#c8cdd8;font-family:'Exo 2',sans-serif;font-size:11px;font-weight:600;cursor:pointer;outline:none;transition:border-color 0.12s}
.inv-select:hover,.inv-select:focus{border-color:#ffd70066}
.inv-filter-group{display:flex;align-items:center;gap:6px}
.inv-count{margin-left:auto;font-size:10px;color:#4a5568;font-family:'Exo 2',sans-serif;letter-spacing:0.5px}
</style>

<div style="width:100%;">
<div class="wrap" id="mainWrap">
<div class="header">
  <div class="header-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <rect x="2" y="8" width="20" height="14" rx="2" fill="#0a0c10" stroke="#ffd700" stroke-width="1.4"/>
      <path d="M7.5 8V6.5a4.5 4.5 0 019 0V8" stroke="#ffd700" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <rect x="9.5" y="12.5" width="5" height="3.5" rx="1" fill="#ffd700"/>
    </svg>
  </div>
  <div class="header-text">
    <h2>CS2 CASE</h2>
    <p>84 ITEMS · STATTRAK AVAILABLE · RARE SPECIAL ITEM INSIDE</p>
  </div>
  <button class="inv-btn" id="invBtn" onclick="openInventory()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-4 0v2M8 7V5a2 2 0 00-4 0v2"/></svg>
    INVENTORY
    <span class="inv-badge" id="invBadge">0</span>
  </button>
</div>
<div class="body">
  <div class="legend" id="legend"></div>
  <div class="reel-wrap" id="reelWrap">
    <div class="reel-track" id="reelTrack"></div>
    <div class="needle"></div>
    <div class="fade-l"></div>
    <div class="fade-r"></div>
  </div>
  <button class="open-btn" id="openBtn" onclick="openCase(event.shiftKey)">OPEN CASE</button>
  <div style="text-align:center;font-size:10px;color:#4a5568;letter-spacing:0.8px;margin-top:6px;font-family:'Exo 2',sans-serif;">HOLD <kbd style="background:#12161e;border:1px solid #1c2130;border-radius:3px;padding:1px 5px;color:#c8cdd8;font-size:10px;">SHIFT</kbd> TO OPEN INSTANTLY</div>
  <div class="result-box" id="resultBox">
    <div class="result-rarity-label" id="resRarityLbl"></div>
    <div class="result-gun-wrap"><canvas id="resCanvas" width="160" height="80"></canvas></div>
    <div class="result-item-name" id="resName"></div>
    <div class="result-skin" id="resSkin"></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="sTotal">0</div><div class="stat-lbl">Opened</div></div>
    <div class="stat"><div class="stat-val" id="sRare">0</div><div class="stat-lbl">Covert+</div></div>
    <div class="stat"><div class="stat-val" id="sKnife">0</div><div class="stat-lbl">Knives</div></div>
  </div>
  <div class="history" id="history"></div>
</div>
</div>

<div class="knife-reveal" id="knifeReveal">
  <div class="reveal-eyebrow">Rare Special Item</div>
  <div class="reveal-stars">★ ★ ★</div>
  <canvas id="revealCanvas" width="200" height="100" style="display:block;margin:0 auto 10px"></canvas>
  <div class="reveal-name" id="revealName"></div>
  <div class="reveal-skin-lbl" id="revealSkinLbl"></div>
  <div class="reveal-stattrak">★ StatTrak™ Available</div>
  <div class="reveal-bar-track"><div class="reveal-bar-fill" id="revealFill" style="width:100%"></div></div>
  <div class="reveal-timer">Closing in <span id="revealSecs">10</span>s</div>
</div>

<div class="inv-overlay" id="invOverlay">
  <div class="inv-header">
    <h3>INVENTORY</h3>
    <button class="inv-close" onclick="closeInventory()">✕ CLOSE</button>
  </div>
  <div class="inv-filters">
    <div class="inv-filter-group">
      <label>Rarity</label>
      <select class="inv-select" id="filterRarity" onchange="renderInventory()">
        <option value="all">All</option>
        <option value="milspec">Mil-Spec</option>
        <option value="restricted">Restricted</option>
        <option value="classified">Classified</option>
        <option value="covert">Covert</option>
        <option value="special">★ Special</option>
      </select>
    </div>
    <div class="inv-filter-group">
      <label>Wear</label>
      <select class="inv-select" id="filterWear" onchange="renderInventory()">
        <option value="all">All</option>
        <option value="Factory New">Factory New</option>
        <option value="Minimal Wear">Minimal Wear</option>
        <option value="Field-Tested">Field-Tested</option>
        <option value="Well-Worn">Well-Worn</option>
        <option value="Battle-Scarred">Battle-Scarred</option>
      </select>
    </div>
    <div class="inv-filter-group">
      <label>Type</label>
      <select class="inv-select" id="filterType" onchange="renderInventory()">
        <option value="all">All</option>
        <option value="rifle">Rifle</option>
        <option value="pistol">Pistol</option>
        <option value="sniper">Sniper</option>
        <option value="smg">SMG</option>
        <option value="shotgun">Shotgun</option>
        <option value="knife">Knife</option>
      </select>
    </div>
    <div class="inv-filter-group">
      <label>Sort</label>
      <select class="inv-select" id="sortBy" onchange="renderInventory()">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="rarity_high">Rarity ↑</option>
        <option value="rarity_low">Rarity ↓</option>
      </select>
    </div>
    <span class="inv-count" id="invCount"></span>
  </div>
  <div class="inv-body" id="invBody"></div>
</div>
</div>

function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}

function playSpinAudio(){
  try{
    const ac=getAudio();
    const bytes=atob(SPIN_AUDIO_B64);
    const buf=new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++)buf[i]=bytes.charCodeAt(i);
    ac.decodeAudioData(buf.buffer,function(decoded){
      const src=ac.createBufferSource();
      src.buffer=decoded;
      src.connect(ac.destination);
      src.start();
      window._spinSrc=src;
      src.onended=function(){window._spinSrc=null;};
    }).catch(()=>{});
  }catch(e){}
}

function stopSpinAudio(){
  try{if(window._spinSrc){window._spinSrc.stop();window._spinSrc=null;}}catch(e){}
}

function getDuration(){
  return new Promise(resolve=>{
    try{
      const ac=getAudio();
      const bytes=atob(SPIN_AUDIO_B64);
      const buf=new Uint8Array(bytes.length);
      for(let i=0;i<bytes.length;i++)buf[i]=bytes.charCodeAt(i);
      ac.decodeAudioData(buf.buffer,function(decoded){resolve(decoded.duration);}).catch(()=>resolve(4.8));
    }catch(e){resolve(4.8);}
  });
}

function playKnifeSound(){
  try{
    const ac=getAudio();
    KNIFE_SOUND_FREQ.forEach(([freq,when])=>{
      const o=ac.createOscillator();const g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.frequency.value=freq;o.type='sine';
      g.gain.setValueAtTime(0,ac.currentTime+when);
      g.gain.linearRampToValueAtTime(0.4,ac.currentTime+when+0.05);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+when+0.4);
      o.start(ac.currentTime+when);o.stop(ac.currentTime+when+0.5);
    });
    setTimeout(()=>{
      const o=ac.createOscillator();const g=ac.createGain();
      o.connect(g);g.connect(ac.destination);
      o.frequency.setValueAtTime(200,ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(800,ac.currentTime+0.1);
      o.frequency.exponentialRampToValueAtTime(1600,ac.currentTime+0.3);
      o.type='sawtooth';
      g.gain.setValueAtTime(0.15,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.5);
      o.start(ac.currentTime);o.stop(ac.currentTime+0.6);
    },800);
  }catch(e){}
}

function rand(a){return a[Math.floor(Math.random()*a.length)];}
function pickR(){let v=Math.random(),a=0;for(const r of RARITIES){a+=r.chance;if(v<a)return r;}return RARITIES[RARITIES.length-1];}

function drawWeapon(cv,type,col,sc,tick){
  const c=cv.getContext('2d'),w=cv.width,h=cv.height,s=sc||1,t=tick||0;
  c.clearRect(0,0,w,h);c.save();
  const ky=tick!=null?Math.sin(t*0.17)*2.2:0,kr=tick!=null?Math.sin(t*0.13)*0.045:0;
  c.translate(w/2,h/2+ky);c.rotate(kr);
  c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2*s;c.lineCap='round';c.lineJoin='round';
  if(type==='knife'){c.save();c.rotate(-0.48);c.beginPath();c.moveTo(-36*s,-6.5*s);c.lineTo(37*s,0);c.lineTo(-36*s,6.5*s);c.closePath();c.globalAlpha=0.88;c.fill();c.globalAlpha=1;c.strokeStyle='rgba(255,255,255,0.35)';c.lineWidth=0.7*s;c.stroke();c.fillStyle='#666';c.fillRect(-52*s,-7*s,16*s,14*s);c.strokeStyle=col;c.lineWidth=1.2*s;c.strokeRect(-52*s,-7*s,16*s,14*s);c.restore();return;}
  if(type==='pistol'){c.save();c.rotate(-0.13);c.fillRect(-18*s,-5*s,36*s,10*s);c.fillRect(-13*s,-5*s,22*s,21*s);c.fillRect(-9*s,15*s,10*s,11*s);c.strokeRect(-18*s,-5*s,36*s,10*s);c.strokeRect(-13*s,-5*s,22*s,21*s);c.strokeRect(-9*s,15*s,10*s,11*s);c.restore();return;}
  if(type==='rifle'){c.save();c.rotate(-0.07);c.fillRect(-28*s,-5*s,56*s,10*s);c.fillRect(-11*s,-5*s,21*s,15*s);c.fillRect(-7*s,9*s,8*s,13*s);c.fillRect(26*s,-2.5*s,7*s,5*s);c.fillRect(-34*s,-2.5*s,9*s,5*s);c.strokeRect(-28*s,-5*s,56*s,10*s);c.strokeRect(-11*s,-5*s,21*s,15*s);c.strokeRect(-7*s,9*s,8*s,13*s);c.restore();return;}
  if(type==='sniper'){c.save();c.rotate(-0.05);c.fillRect(-32*s,-4*s,64*s,8*s);c.fillRect(-9*s,-4*s,19*s,17*s);c.fillRect(-5*s,12*s,8*s,13*s);c.fillRect(9*s,-13*s,7*s,15*s);c.strokeRect(-32*s,-4*s,64*s,8*s);c.strokeRect(-9*s,-4*s,19*s,17*s);c.strokeRect(-5*s,12*s,8*s,13*s);c.strokeRect(9*s,-13*s,7*s,15*s);c.fillStyle='rgba(255,255,255,0.6)';c.beginPath();c.arc(12*s,-7*s,3.5*s,0,Math.PI*2);c.fill();c.restore();return;}
  if(type==='shotgun'){c.save();c.rotate(-0.08);c.fillRect(-26*s,-7*s,52*s,6*s);c.fillRect(-26*s,0,52*s,6*s);c.fillRect(-15*s,6*s,28*s,13*s);c.fillRect(-11*s,18*s,9*s,11*s);c.strokeRect(-26*s,-7*s,52*s,13*s);c.strokeRect(-15*s,6*s,28*s,13*s);c.strokeRect(-11*s,18*s,9*s,11*s);c.restore();return;}
  if(type==='smg'){c.save();c.rotate(-0.1);c.fillRect(-23*s,-5*s,46*s,10*s);c.fillRect(-9*s,-5*s,20*s,13*s);c.fillRect(-5*s,7*s,7*s,13*s);c.fillRect(18*s,-9*s,7*s,7*s);c.strokeRect(-23*s,-5*s,46*s,10*s);c.strokeRect(-9*s,-5*s,20*s,13*s);c.strokeRect(-5*s,7*s,7*s,13*s);c.restore();return;}
  c.restore();
}

function makeCanvas(item,rar,w,h,live){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  if(rar.id==='special'){let f=0;function qloop(){const ctx=cv.getContext('2d'),pulse=0.55+Math.sin(f*0.07)*0.45;ctx.clearRect(0,0,w,h);ctx.save();ctx.globalAlpha=pulse;ctx.fillStyle=rar.color;ctx.font=`bold ${Math.min(w,h)*0.68}px Rajdhani,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',w/2,h/2+2);ctx.restore();f++;if(live)cv._af=requestAnimationFrame(qloop);}qloop();}
  else if(live){let f=0;function lp(){drawWeapon(cv,item.t,rar.color,w<=90?0.82:1.55,f);f++;cv._af=requestAnimationFrame(lp);}lp();}
  else{drawWeapon(cv,item.t,rar.color,w<=90?0.82:1.55);}
  return cv;
}

function buildLegend(){
  const el=document.getElementById('legend');
  [...RARITIES].reverse().forEach(r=>{
    const b=document.createElement('span');b.className='badge';
    b.style.cssText=`background:${r.bg};color:${r.color};border:1px solid ${r.color}33`;
    b.textContent=`${r.label} ${(r.chance*100).toFixed(2)}%`;
    el.appendChild(b);
  });
}

function buildReel(winR){
  const track=document.getElementById('reelTrack');
  track.innerHTML='';track.style.transition='none';track.style.transform='translateX(0)';
  const N=60,LI=45,items=[];
  for(let i=0;i<N;i++){const r=i===LI?winR:pickR();const item=rand(POOL[r.id]);items.push({r,item});}
  items.forEach(({r,item})=>{
    const d=document.createElement('div');d.className='reel-item';d.style.background=r.bg;
    const cv=makeCanvas(item,r,80,68,false);
    const nm=document.createElement('span');nm.className='reel-name';
    nm.textContent=r.id==='special'?'? ? ?':(item.n.split(' | ')[1]||item.n);
    const pip=document.createElement('div');pip.className='rarity-pip';pip.style.background=r.color;
    d.appendChild(cv);d.appendChild(nm);d.appendChild(pip);
    track.appendChild(d);
  });
  return {items,LI};
}

function launchReveal(item,skin){
  playKnifeSound();
  const ov=document.getElementById('knifeReveal');
  document.getElementById('revealName').textContent=item.n;
  document.getElementById('revealSkinLbl').textContent=skin;
  document.getElementById('revealSecs').textContent='10';
  const fill=document.getElementById('revealFill');
  fill.style.transition='none';fill.style.width='100%';
  if(revealAnim)cancelAnimationFrame(revealAnim);
  const rc=document.getElementById('revealCanvas');let f=0;
  function rl(){drawWeapon(rc,item.t,'#ffd700',1.9,f);f++;revealAnim=requestAnimationFrame(rl);}rl();
  ov.classList.add('on');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fill.style.transition='width 10s linear';fill.style.width='0%';}));
  if(revealIv)clearInterval(revealIv);
  let s=10;
  revealIv=setInterval(()=>{s--;document.getElementById('revealSecs').textContent=s;
    if(s<=0){clearInterval(revealIv);if(revealAnim){cancelAnimationFrame(revealAnim);revealAnim=null;}ov.classList.remove('on');}
  },1000);
}

// Holds state for the currently spinning case so Shift can skip it
let _pendingSpin=null;

function skipCurrentSpin(){
  if(!_pendingSpin) return;
  const {track, finalX, spinTimeout, winR, items, LI} = _pendingSpin;
  _pendingSpin=null;
  // Cancel the scheduled result callback
  clearTimeout(spinTimeout);
  stopSpinAudio();
  // Snap reel instantly to the final position
  track.style.transition='none';
  track.style.transform=`translateX(${finalX}px)`;
  showResult(winR, items[LI].item);
  window._lastSpin=null;
}

function openCase(instant){
  // If a spin is already running, Shift skips it instead of opening a new one
  if(_pendingSpin){
    if(instant) skipCurrentSpin();
    return;
  }
  const now=Date.now();
  if(window._lastSpin && now-window._lastSpin < 8000) return;
  window._lastSpin=now;
  document.getElementById('resultBox').style.display='none';
  if(resultAnim){cancelAnimationFrame(resultAnim);resultAnim=null;}

  const winR=pickR();
  const{items,LI}=buildReel(winR);
  const IW=116,rw=document.getElementById('reelWrap').offsetWidth;
  const finalX=-(LI*IW-(rw/2)+IW/2+(Math.random()*56-28));
  const track=document.getElementById('reelTrack');

  if(instant){
    track.style.transition='none';
    track.style.transform=`translateX(${finalX}px)`;
    showResult(winR,items[LI].item);
    window._lastSpin=null;
    return;
  }

  const dur=7.6;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    track.style.transition=`transform ${dur}s cubic-bezier(0.025,0.75,0.15,1.0)`;
    track.style.transform=`translateX(${finalX}px)`;
    playSpinAudio();
    const spinTimeout=setTimeout(()=>{
      stopSpinAudio();
      _pendingSpin=null;
      showResult(winR,items[LI].item);
      window._lastSpin=null;
    },dur*1000);
    _pendingSpin={track,finalX,spinTimeout,winR,items,LI};
  }));
}

// Shift key = skip current spin OR open instantly if idle
document.addEventListener('keydown',function(e){
  if(e.key==='Shift' && !e.repeat){
    if(_pendingSpin) skipCurrentSpin();
    else openCase(true);
  }
});

function showResult(rar,item){
  const skin=rand(WEARS);const isK=rar.id==='special';
  if(isK)launchReveal(item,skin);
  const box=document.getElementById('resultBox');
  box.style.display='block';box.style.background=rar.bg;box.style.borderColor=rar.color+'55';
  document.getElementById('resRarityLbl').style.color=rar.color;
  document.getElementById('resRarityLbl').textContent=rar.label;
  document.getElementById('resName').style.color=rar.color;
  document.getElementById('resName').textContent=item.n;
  document.getElementById('resSkin').textContent=skin+(isK?' · StatTrak™ Eligible':'');
  const rc=document.getElementById('resCanvas');rc.width=160;rc.height=80;
  let f=0;function lp(){drawWeapon(rc,item.t,rar.color,1.55,f);f++;resultAnim=requestAnimationFrame(lp);}lp();
  opened++;if(rar.id==='covert'||isK)rareCount++;if(isK)knivesCount++;
  document.getElementById('sTotal').textContent=opened;
  document.getElementById('sRare').textContent=rareCount;
  document.getElementById('sKnife').textContent=knivesCount;
  addPill(rar,item.n);
  window.inventory.unshift({rar,item,skin,isK,ts:Date.now()});inventory=window.inventory;
  document.getElementById('invBadge').textContent=inventory.length;console.log('Inventory updated:',inventory.length);
}

function addPill(rar,name){
  const row=document.getElementById('history');
  const p=document.createElement('span');p.className='h-pill';
  p.style.cssText=`background:${rar.bg};color:${rar.color};border:1px solid ${rar.color}44`;
  p.textContent=name.split(' | ')[1]||name;
  row.insertBefore(p,row.firstChild);
  if(row.children.length>14)row.removeChild(row.lastChild);
}

const RARITY_ORDER={milspec:0,restricted:1,classified:2,covert:3,special:4};

function renderInventory(){
  inventory=window.inventory;
  const body=document.getElementById('invBody');
  body.innerHTML='';
  if(!inventory.length){
    body.innerHTML='<div class="inv-empty"><span>📦</span>No items yet.<br>Open some cases to fill your inventory!</div>';
    document.getElementById('invCount').textContent='';
    return;
  }
  const fRar=document.getElementById('filterRarity').value;
  const fWear=document.getElementById('filterWear').value;
  const fType=document.getElementById('filterType').value;
  const sort=document.getElementById('sortBy').value;

  let items=[...inventory];
  if(fRar!=='all') items=items.filter(e=>e.rar.id===fRar);
  if(fWear!=='all') items=items.filter(e=>e.skin===fWear);
  if(fType!=='all') items=items.filter(e=>e.item.t===fType);

  if(sort==='oldest') items.sort((a,b)=>a.ts-b.ts);
  else if(sort==='rarity_high') items.sort((a,b)=>RARITY_ORDER[b.rar.id]-RARITY_ORDER[a.rar.id]);
  else if(sort==='rarity_low') items.sort((a,b)=>RARITY_ORDER[a.rar.id]-RARITY_ORDER[b.rar.id]);
  // newest is default (already unshifted)

  document.getElementById('invCount').textContent=`${items.length} / ${inventory.length} items`;

  if(!items.length){
    body.innerHTML='<div class="inv-empty"><span>🔍</span>No items match your filters.</div>';
    return;
  }
  const grid=document.createElement('div');grid.className='inv-grid';
  items.forEach(({rar,item,skin,isK})=>{
    const card=document.createElement('div');card.className='inv-card';
    card.style.cssText=`background:${rar.bg};border-color:${rar.color}44`;
    const cv=makeCanvas(item,rar,80,60,false);
    const nm=document.createElement('div');nm.className='inv-card-name';nm.style.color=rar.color;nm.textContent=item.n.split(' | ')[1]||item.n;
    const sk=document.createElement('div');sk.className='inv-card-skin';sk.textContent=skin;
    const rl=document.createElement('div');rl.className='inv-card-rarity';rl.style.color=rar.color;rl.textContent=rar.label+(isK?' ★':'');
    card.appendChild(cv);card.appendChild(nm);card.appendChild(sk);card.appendChild(rl);
    grid.appendChild(card);
  });
  body.appendChild(grid);
}

function openInventory(){
  document.getElementById('invOverlay').classList.add('on');
  renderInventory();
}

function closeInventory(){document.getElementById('invOverlay').classList.remove('on');}

buildLegend();buildReel(pickR());
</script>
