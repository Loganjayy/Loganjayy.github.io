<!DOCTYPE html>
<html>
<body>
  <img src="funny.png" alt="Description of image">
<button onclick="sendData()">Send POST Request</button>

<script>
function sendData() {
  fetch('https://eoqymilbfeiir1o.m.pipedream.net/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ message: 'Hello from HTML page!' })
  })
  .then(response => response.json())
  .then(data => console.log('Success:', data))
  .catch(error => console.error('Error:', error));
}
</script>
</body>
</html>
